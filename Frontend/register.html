          <a href="register.html" class="active">
            <img src="https://img.icons8.com/fluency/48/add-user-male.png" alt="Register">

          </a>
        </li>
        <li>
          <a href="manage-students.html">
            <img src="https://img.icons8.com/fluency/48/conference-call.png" alt="Students">
            <span>Students</span>
          </a>
        </li>
        <li>
          <a href="add-skill.html">
            <img src="https://img.icons8.com/fluency/48/idea.png" alt="Add Skill">

        </li>
        <li>

          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<!-- ══════ MAIN ══════ -->
<main>
  <div class="container">
    <div class="page-hero">
      <h1>Register Student</h1>
      <p>Fill in the form below to add a new student to SkillShare Hub</p>
    </div>

    <div class="form-wrap">
      <div class="card">
        <table class="form-table">

          <tr>
            <td><label for="rollno">Roll Number</label></td>
            <td><input type="number" id="rollno"></td>
          </tr>

          <tr>
            <td><label for="name">Full Name</label></td>
            <td><input type="text" id="name"></td>
          </tr>

          <tr>
            <td><label for="dept">Department</label></td>
            <td><input type="text" id="dept"></td>
          </tr>

          <tr>
            <td><label for="year">Year</label></td>
            <td>
              <select id="year">
                <option value="">Select year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
            </td>
          </tr>

          <tr>
            <td><label for="email">Email</label></td>
            <td><input type="email" id="email" ></td>
          </tr>

          <tr>
            <td><label for="skill">Primary Skill</label></td>
            <td><input type="text" id="skill"></td>
          </tr>

          <tr class="btn-row">
            <td colspan="2" style="text-align:center; padding-top:1.5rem;">
              <button class="btn btn-primary" onclick="registerStudent()">
                📝&nbsp; Register Student
              </button>
            </td>
          </tr>

        </table>
      </div>
    </div>
  </div>
</main>

    <li><a href="add-skill.html"><img src="https://img.icons8.com/fluency/48/idea.png" alt="">Add Skill</a></li>
    <li><a href="manage-skills.html"><img src="https://img.icons8.com/fluency/48/combo-chart.png" alt="">Skills</a></li>
    <li><a href="student-profile.html"><img src="https://img.icons8.com/fluency/48/user-male-circle.png" alt="">Profile</a></li>
  </ul>
  <p class="footer-copy">SkillShare Hub &copy; 2025 &nbsp;·&nbsp; College Project</p>
</footer>

<div id="toast"></div>

<script>
  const API = "http://127.0.0.1:8000";

  function showToast(msg, type) {
    let t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "show " + (type || "");
    setTimeout(() => { t.className = ""; }, 3000);
  }

  async function registerStudent() {
    let rollno = document.getElementById("rollno").value.trim();
    let name   = document.getElementById("name").value.trim();
    let dept   = document.getElementById("dept").value.trim();
    let year   = document.getElementById("year").value;
    let email  = document.getElementById("email").value.trim();
    let skill  = document.getElementById("skill").value.trim();

    if (!rollno || !name || !dept || !year || !email || !skill) {
      showToast("⚠️ Please fill in all fields.", "error"); return;
    }
    if (!email.includes("@")) {
      showToast("⚠️ Enter a valid email address.", "error"); return;
    }

    try {
      let res = await fetch(API + "/StudentsDetails", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          rollno: parseInt(rollno), Name: name,
          Department: dept, Year: year, Email: email, Skill: skill
        })
      });

      if (res.ok) {
        showToast("✅ Student registered successfully!", "success");
        ["rollno","name","dept","email","skill"].forEach(id => document.getElementById(id).value = "");
        document.getElementById("year").value = "";
      } else {
        let err = await res.json();
        showToast("❌ " + (err.detail || "Registration failed."), "error");
      }
    } catch(e) {
      showToast("❌ Could not connect to server.", "error");
    }
  }
</script>
</body>
</html>
